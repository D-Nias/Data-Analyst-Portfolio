<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" role="img">
<title>Washington EV registry snapshot</title><desc>298,916 Washington records · September 2026 download. Source: Washington State Department of Licensing</desc>
