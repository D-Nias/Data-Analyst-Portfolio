<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img">
<title>E-commerce purchase behavior</title><desc>12,330 shopping sessions · UCI public dataset. Source: UCI Online Shoppers Purchasing Intention · 2018</desc>
<rect width="1000" height="1000" fill="#ffffff"/>
<rect width="1000" height="12" fill="#11877f"/>
<text x="55" y="68" fill="#15243a" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="bold" text-anchor="start">E-commerce purchase behavior</text>
<text x="55" y="102" fill="#5c6a79" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" text-anchor="start">12,330 shopping sessions · UCI public dataset</text>
<text x="55" y="155" fill="#15243a" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="bold" text-anchor="start">Purchase rate by visitor type</text>
<text x="55" y="199" fill="#213047" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" text-anchor="start">New</text><rect x="55" y="209" width="690" height="24" rx="12" fill="#e8edf2"/><rect x="55" y="209" width="572.9" height="24" rx="12" fill="#11877f"/><text x="763" y="229" fill="#213047" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="bold" text-anchor="start">24.91%</text>
<text x="55" y="261" fill="#213047" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" text-anchor="start">Returning</text><rect x="55" y="271" width="690" height="24" rx="12" fill="#e8edf2"/><rect x="55" y="271" width="320.4" height="24" rx="12" fill="#11877f"/><text x="763" y="291" fill="#213047" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="bold" text-anchor="start">13.93%</text>
<text x="55" y="370" fill="#647285" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" text-anchor="start">Percent of sessions ending in purchase</text>
<text x="55" y="420" fill="#15243a" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="bold" text-anchor="start">Purchase rate by product pages viewed</text>
<text x="55" y="464" fill="#213047" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" text-anchor="start">0–5 pages</text><rect x="55" y="474" width="690" height="24" rx="12" fill="#e8edf2"/><rect x="55" y="474" width="85.0" height="24" rx="12" fill="#11877f"/><text x="763" y="494" fill="#213047" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="bold" text-anchor="start">4.31%</text>
<text x="55" y="526" fill="#213047" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" text-anchor="start">6–20 pages</text><rect x="55" y="536" width="690" height="24" rx="12" fill="#e8edf2"/><rect x="55" y="536" width="260.6" height="24" rx="12" fill="#11877f"/><text x="763" y="556" fill="#213047" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="bold" text-anchor="start">13.22%</text>
<text x="55" y="588" fill="#213047" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" text-anchor="start">21–50 pages</text><rect x="55" y="598" width="690" height="24" rx="12" fill="#e8edf2"/><rect x="55" y="598" width="391.9" height="24" rx="12" fill="#11877f"/><text x="763" y="618" fill="#213047" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="bold" text-anchor="start">19.88%</text>
<text x="55" y="650" fill="#213047" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" text-anchor="start">51–100 pages</text><rect x="55" y="660" width="690" height="24" rx="12" fill="#e8edf2"/><rect x="55" y="660" width="434.5" height="24" rx="12" fill="#11877f"/><text x="763" y="680" fill="#213047" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="bold" text-anchor="start">22.04%</text>
<text x="55" y="712" fill="#213047" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" text-anchor="start">101+ pages</text><rect x="55" y="722" width="690" height="24" rx="12" fill="#e8edf2"/><rect x="55" y="722" width="624.4" height="24" rx="12" fill="#11877f"/><text x="763" y="742" fill="#213047" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="bold" text-anchor="start">31.67%</text>
<text x="55" y="821" fill="#647285" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" text-anchor="start">Association only; more browsing is not proven to cause purchasing</text>
<line x1="55" y1="927" x2="945" y2="927" stroke="#d6dee8"/>
<text x="55" y="958" fill="#5c6a79" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" text-anchor="start">Source: UCI Online Shoppers Purchasing Intention · 2018</text>
</svg>